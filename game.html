<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nova Strike</title><style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;height:100dvh;display:grid;place-items:center;overflow:hidden;background:#02040d;color:#fff;font-family:Arial}#game{position:relative;width:min(100vw,1000px);height:min(100dvh,720px);overflow:hidden;background:radial-gradient(circle at 50% 25%,#1a3271,#030511 65%);box-shadow:0 0 65px #36d7ff66}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:16px 22px;font-weight:800;text-shadow:0 0 12px #5cf4ff}.hud small{display:block;color:#9ac1e6;letter-spacing:2px}.hud b{font-size:24px}.right{text-align:right}#lives{color:#ff78cb}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#020513aa}.panel{max-width:520px;padding:30px;border:1px solid #55edff88;background:#08132be8;box-shadow:0 0 42px #17c9ff33}h1{font-size:clamp(42px,9vw,76px);letter-spacing:-4px;font-style:italic;margin:0;text-shadow:4px 4px #9f197e,0 0 25px #5bf5ff}h1 i{color:#5bf5ff}p{color:#c7d8eb;line-height:1.5}button{padding:12px 23px;border:1px solid white;background:#5bf5ff;color:#061222;font-weight:bold;letter-spacing:1px;box-shadow:0 0 18px #5bf5ff99;cursor:pointer}.hide{display:none}#pause{position:absolute;right:15px;bottom:15px;border-radius:50%;padding:10px 14px;font-size:16px}.touch{display:none;position:absolute;bottom:13px;left:15px;right:15px;justify-content:space-between}.touch button{width:68px;height:68px;border-radius:50%;padding:0;background:#0c2947dd;color:#5bf5ff;font-size:24px}@media(pointer:coarse),(max-width:700px){#game{width:100vw;height:100dvh}.touch{display:flex}#pause{bottom:95px}.hud{padding:12px}.hud b{font-size:19px}}</style></head><body>
<main id="game"><canvas id="c"></canvas><div class="hud"><div><small>SCORE</small><b id="score">000000</b></div><div class="right"><small>HIGH SCORE</small><b id="high">000000</b><br><span id="lives">◆ ◆ ◆</span></div></div><button id="pause">Ⅱ</button><div class="touch"><button data-key="arrowleft">◀</button><button data-key=" ">✦</button><button data-key="arrowright">▶</button></div><section id="start" class="overlay"><div class="panel"><h1>NOVA <i>STRIKE</i></h1><p>Defend the last star system. Blast hostile fleets, claim upgrades, and destroy the dreadnought.</p><button id="launch">LAUNCH MISSION</button><p><small>WASD / ARROWS move · SPACE fires · P pauses</small></p></div></section><section id="end" class="overlay hide"><div class="panel"><h1 id="endTitle">MISSION OVER</h1><p id="endText"></p><button id="restart">FLY AGAIN</button></div></section></main>
<script>
'use strict';const x=c.getContext('2d'),keys={},stars=[],shots=[],foes=[],bits=[],ups=[];let W,H,on=false,paused=false,prev=0,points=0,life=3,level=1,kills=0,spawn=0,boss=false,actx,ship;
function fit(){W=c.clientWidth;H=c.clientHeight;let d=Math.min(devicePixelRatio,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();for(let i=0;i<135;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()*2});
function beep(f=300,d=.06,t='sine',v=.03){try{actx??=new AudioContext;let o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function hud(){score.textContent=('000000'+points).slice(-6);high.textContent=('000000'+Math.max(points,+localStorage.novaStrike||0)).slice(-6);lives.textContent=life?'◆ '.repeat(life):'—'}function scoreAdd(n){points+=n;localStorage.novaStrike=Math.max(points,+localStorage.novaStrike||0);hud()}function collide(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}function burst(X,Y,col,n=20){for(let i=0;i<n;i++){let a=Math.random()*6.28,v=55+Math.random()*260;bits.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.25+Math.random()*.65,col})}}
function reset(){points=0;life=3;level=1;kills=spawn=0;boss=false;shots.length=foes.length=bits.length=ups.length=0;ship={x:W/2,y:H-85,r:17,cd:0,inv:1.3,pow:0,rapid:0};hud()}function fire(){if(ship.cd>0)return;ship.cd=ship.rapid?.1:.22;let n=ship.pow?3:1;for(let i=0;i<n;i++)shots.push({x:ship.x+(i-(n-1)/2)*14,y:ship.y-20,v:-700,r:4,evil:false});beep(630,.035,'square',.02)}
function make(){let type=Math.random()<.17?'tank':Math.random()<.45?'zig':'scout',r=type==='tank'?29:18;foes.push({type,x:r+Math.random()*(W-r*2),y:-r,r,h:type==='tank'?6:1,max:type==='tank'?6:1,t:0,cd:Math.random()*1.3})}function makeBoss(){foes.push({type:'boss',x:W/2,y:-80,r:68,h:90+level*10,max:90+level*10,t:0,cd:1});boss=true}
function dead(e){e.h--;burst(e.x,e.y,'#77f7ff',4);if(e.h>0){beep(170,.03,'square',.02);return false}scoreAdd(e.type==='boss'?2500:e.type==='tank'?120:60);burst(e.x,e.y,e.type==='boss'?'#ff4dc4':'#ffca55',e.type==='boss'?80:25);beep(e.type==='boss'?75:135,.18,'sawtooth',.06);if(e.type==='boss')setTimeout(()=>finish(true),500);else if(Math.random()<.14)ups.push({x:e.x,y:e.y,r:12,v:110,type:Math.random()<.5?'P':'R'});return true}function damage(){if(ship.inv>0)return;life--;ship.inv=1.7;burst(ship.x,ship.y,'#ff4ecb',40);beep(70,.3,'sawtooth',.07);hud();if(!life)setTimeout(()=>finish(false),300)}
function update(d){for(const s of stars){s.y+=s.z*55*d;if(s.y>H){s.y=0;s.x=Math.random()*W}}ship.cd-=d;ship.inv-=d;ship.pow-=d;ship.rapid-=d;let mx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),my=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);ship.x=Math.max(17,Math.min(W-17,ship.x+mx*390*d));ship.y=Math.max(70,Math.min(H-18,ship.y+my*390*d));if(keys[' '])fire();spawn-=d;if(!boss&&spawn<0){make();spawn=Math.max(.35,1.05-level*.055)}for(let i=shots.length;i--;){let q=shots[i];q.y+=q.v*d;if(q.y<-30||q.y>H+30)shots.splice(i,1);else if(q.evil&&collide(q,ship)){shots.splice(i,1);damage()}}for(let i=foes.length;i--;){let e=foes[i];e.t+=d;if(e.type==='boss'){e.y+=(95-e.y)*d*1.5;e.x=W/2+Math.sin(e.t*.7)*W*.3;e.cd-=d;if(e.cd<0){e.cd=.36;for(let j=-2;j<3;j++)shots.push({x:e.x+j*18,y:e.y+55,v:305,r:6,evil:true})}}else{e.y+=(e.type==='tank'?54:110)*d;e.x+=Math.sin(e.t*(e.type==='zig'?4:1.5))*(e.type==='zig'?120:25)*d;e.cd-=d;if(e.cd<0){e.cd=1.5+Math.random()*1.3;shots.push({x:e.x,y:e.y+e.r,v:245,r:5,evil:true})}}if(collide(e,ship)){if(e.type!=='boss')foes.splice(i,1);damage()}else if(e.y>H+70)foes.splice(i,1)}for(let i=shots.length;i--;)if(!shots[i].evil)for(let j=foes.length;j--;){if(collide(shots[i],foes[j])){shots.splice(i,1);if(dead(foes[j])){foes.splice(j,1);if(++kills%18===0){level++;if(level%3===0&&!boss)makeBoss()}}break}}for(let i=ups.length;i--;){let q=ups[i];q.y+=q.v*d;if(collide(q,ship)){q.type==='P'?ship.pow=10:ship.rapid=9;scoreAdd(40);beep(880,.12);ups.splice(i,1)}else if(q.y>H)ups.splice(i,1)}for(let i=bits.length;i--;){let q=bits[i];q.l-=d;q.x+=q.vx*d;q.y+=q.vy*d;q.vx*=.96;q.vy*=.96;if(q.l<0)bits.splice(i,1)}}
function poly(X,Y,r,n,a=0){x.beginPath();for(let i=0;i<n;i++){let z=a+i*6.283/n;x[i?'lineTo':'moveTo'](X+Math.cos(z)*r,Y+Math.sin(z)*r)}x.closePath()}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#fff';for(const s of stars){x.globalAlpha=s.z*.5;x.fillRect(s.x,s.y,s.z,s.z)}x.globalAlpha=1;for(const p of bits){x.globalAlpha=p.l;x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;for(const u of ups){x.fillStyle=u.type==='P'?'#ffd752':'#65f8ff';x.shadowBlur=16;x.shadowColor=x.fillStyle;poly(u.x,u.y,12,4,.78);x.fill();x.shadowBlur=0;x.fillStyle='#071329';x.font='bold 12px Arial';x.textAlign='center';x.fillText(u.type,u.x,u.y+4)}for(const q of shots){x.fillStyle=q.evil?'#ff5b9a':'#64f8ff';x.shadowBlur=12;x.shadowColor=x.fillStyle;x.fillRect(q.x-q.r/2,q.y-q.r,q.r,q.r*2);x.shadowBlur=0}for(const e of foes){let col=e.type==='boss'?'#ff4ecb':e.type==='tank'?'#ffb04a':'#bd65ff';x.fillStyle=col;x.shadowBlur=18;x.shadowColor=col;poly(e.x,e.y,e.r,e.type==='boss'?6:e.type==='tank'?4:3,e.type==='boss'?.52:1.57);x.fill();x.shadowBlur=0;if(e.max>1){x.fillStyle='#17213c';x.fillRect(e.x-e.r,e.y-e.r-14,e.r*2,5);x.fillStyle='#65f8ff';x.fillRect(e.x-e.r,e.y-e.r-14,e.r*2*e.h/e.max,5)}}x.save();x.translate(ship.x,ship.y);x.globalAlpha=ship.inv>0&&Math.floor(ship.inv*10)%2?.3:1;x.fillStyle='#5df6ff';x.shadowBlur=20;x.shadowColor='#5df6ff';poly(0,0,17,3,-1.57);x.fill();x.fillStyle='#ff4ecb';x.fillRect(-5,0,10,12);x.restore();x.globalAlpha=1;if(paused){x.font='bold 42px Arial';x.textAlign='center';x.fillText('PAUSED',W/2,H/2)}}
function loop(t){if(!on)return;let d=Math.min(.04,(t-prev)/1000||0);prev=t;if(!paused)update(d);draw();requestAnimationFrame(loop)}function play(){reset();start.classList.add('hide');end.classList.add('hide');on=true;paused=false;prev=performance.now();requestAnimationFrame(loop);beep(300,.15)}function finish(win){on=false;endTitle.textContent=win?'SECTOR SECURED':'MISSION OVER';endText.textContent=(win?'Dreadnought destroyed! ':'')+'Final score: '+points.toLocaleString();end.classList.remove('hide')}function toggle(){if(on){paused=!paused;beep(paused?220:440)}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='p')toggle()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('.touch button').forEach(b=>['pointerdown','pointerup','pointercancel'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();keys[b.dataset.key]=v==='pointerdown'})));launch.onclick=play;restart.onclick=play;pause.onclick=toggle;c.addEventListener('pointerdown',e=>{if(on){let r=c.getBoundingClientRect();ship.x=(e.clientX-r.left)/r.width*W;ship.y=(e.clientY-r.top)/r.height*H;fire()}});hud();
</script></body></html>
